{% extends "site_app_base.html" %}

{% block title %}비밀번호 변경 | SlideArchitect{% endblock %}

{% block app_content %}
<div class="flex min-h-[calc(100vh-64px)] items-center justify-center px-4 py-8 md:px-8">
    <section class="w-full max-w-2xl rounded-[28px] border border-white/70 bg-surface-container-lowest p-8 shadow-studio">
        <div class="mb-8">
            <p class="text-xs font-bold uppercase tracking-[0.26em] text-primary">Security</p>
            <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-on-surface">비밀번호 변경</h1>
            <p class="mt-3 text-sm leading-6 text-on-surface-variant">이전 템플릿의 잘못된 이메일 폼 제거. 실제 비밀번호 변경 필드로 교체했습니다.</p>
        </div>
        {% if form.errors %}
            <div class="mb-5 rounded-2xl border border-error/15 bg-error/5 px-4 py-3 text-sm font-medium text-error">
                입력값을 다시 확인해 주세요.
            </div>
        {% endif %}
        <form class="space-y-4" method="post">
            {% csrf_token %}
            <div class="space-y-2">
                <label class="ml-1 text-xs font-semibold text-on-surface-variant" for="{{ form.old_password.id_for_label }}">현재 비밀번호</label>
                <input class="w-full rounded-2xl border-none bg-surface-container-low px-4 py-3 text-sm font-medium text-on-surface focus:ring-2 focus:ring-primary/25" id="{{ form.old_password.id_for_label }}" name="{{ form.old_password.html_name }}" required type="password" />
            </div>
            <div class="space-y-2">
                <label class="ml-1 text-xs font-semibold text-on-surface-variant" for="{{ form.new_password1.id_for_label }}">새 비밀번호</label>
                <input class="w-full rounded-2xl border-none bg-surface-container-low px-4 py-3 text-sm font-medium text-on-surface focus:ring-2 focus:ring-primary/25" id="{{ form.new_password1.id_for_label }}" name="{{ form.new_password1.html_name }}" required type="password" />
            </div>
            <div class="space-y-2">
                <label class="ml-1 text-xs font-semibold text-on-surface-variant" for="{{ form.new_password2.id_for_label }}">새 비밀번호 확인</label>
                <input class="w-full rounded-2xl border-none bg-surface-container-low px-4 py-3 text-sm font-medium text-on-surface focus:ring-2 focus:ring-primary/25" id="{{ form.new_password2.id_for_label }}" name="{{ form.new_password2.html_name }}" required type="password" />
            </div>
            <div class="flex justify-end gap-3 pt-4">
                <a class="rounded-xl border border-outline-variant/20 px-4 py-3 text-sm font-semibold text-on-surface-variant transition hover:bg-surface-container-low" href="{% url 'profile' %}">취소</a>
                <button class="rounded-xl bg-gradient-to-br from-primary to-primary-container px-5 py-3 text-sm font-bold text-on-primary shadow-lg shadow-primary/20 transition hover:opacity-90" type="submit">비밀번호 업데이트</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
