{% extends "site_auth_base.html" %}

{% block title %}회원가입 | SlideArchitect{% endblock %}

{% block auth_intro %}
    <p class="mt-3 text-sm font-medium text-on-surface-variant">새 작업실 계정을 만들고 AI PPT 워크플로우를 바로 시작합니다.</p>
{% endblock %}

{% block auth_content %}
    {% if form.errors %}
        <div class="mb-5 rounded-2xl border border-error/15 bg-error/5 px-4 py-3 text-sm font-medium text-error">
            입력값을 다시 확인해 주세요.
        </div>
    {% endif %}
    <form class="space-y-4" method="post">
        {% csrf_token %}
        <div class="space-y-2">
            <label class="ml-1 text-xs font-semibold text-on-surface-variant" for="id_username">아이디</label>
            <input class="w-full rounded-2xl border-none bg-surface-container-low px-4 py-3 text-sm font-medium text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/25" id="id_username" name="username" placeholder="username" required type="text" value="{{ form.username.value|default:'' }}" />
        </div>
        <div class="space-y-2">
            <label class="ml-1 text-xs font-semibold text-on-surface-variant" for="id_nickname">닉네임</label>
            <input class="w-full rounded-2xl border-none bg-surface-container-low px-4 py-3 text-sm font-medium text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/25" id="id_nickname" name="nickname" placeholder="nickname" required type="text" value="{{ form.nickname.value|default:'' }}" />
        </div>
        <div class="space-y-2">
            <label class="ml-1 text-xs font-semibold text-on-surface-variant" for="id_email">이메일</label>
            <input class="w-full rounded-2xl border-none bg-surface-container-low px-4 py-3 text-sm font-medium text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/25" id="id_email" name="email" placeholder="name@company.com" required type="email" value="{{ form.email.value|default:'' }}" />
        </div>
        <div class="grid gap-4 md:grid-cols-2">
            <div class="space-y-2">
                <label class="ml-1 text-xs font-semibold text-on-surface-variant" for="id_password1">비밀번호</label>
                <input class="w-full rounded-2xl border-none bg-surface-container-low px-4 py-3 text-sm font-medium text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/25" id="id_password1" name="password1" placeholder="8자 이상" required type="password" />
            </div>
            <div class="space-y-2">
                <label class="ml-1 text-xs font-semibold text-on-surface-variant" for="id_password2">비밀번호 확인</label>
                <input class="w-full rounded-2xl border-none bg-surface-container-low px-4 py-3 text-sm font-medium text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/25" id="id_password2" name="password2" placeholder="다시 입력" required type="password" />
            </div>
        </div>
        <button class="flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-primary to-primary-container px-4 py-4 text-sm font-bold text-on-primary shadow-lg shadow-primary/20 transition hover:opacity-90" type="submit">
            <span class="material-symbols-outlined text-base">person_add</span>
            회원가입
        </button>
    </form>
    <p class="mt-6 text-center text-sm text-on-surface-variant">
        이미 계정이 있나요?
        <a class="ml-1 font-bold text-primary transition hover:text-primary-dim" href="{% url 'login' %}">로그인</a>
    </p>
{% endblock %}
