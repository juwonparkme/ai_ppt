{% with route=request.resolver_match.url_name %}
<header class="fixed top-0 z-50 flex h-16 w-full items-center justify-between gap-3 border-b border-white/50 bg-surface/90 px-4 shadow-sm backdrop-blur-xl md:px-6">
    <div class="flex min-w-0 items-center gap-3 md:gap-6">
        <a class="flex min-w-0 items-center gap-3" href="{% url 'home' %}">
            <span class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
            </span>
            <span class="truncate bg-gradient-to-br from-primary to-primary-container bg-clip-text text-lg font-extrabold tracking-tight text-transparent sm:text-xl">SlideArchitect</span>
        </a>
        <nav class="hidden items-center gap-5 md:flex">
            <a class="text-sm font-semibold {% if route == 'home' or route == 'sign_in' %}border-b-2 border-primary pb-1 text-primary{% else %}text-on-surface-variant hover:text-primary{% endif %}" href="{% url 'home' %}">Dashboard</a>
            <a class="text-sm font-semibold {% if route == 'prompt' %}border-b-2 border-primary pb-1 text-primary{% else %}text-on-surface-variant hover:text-primary{% endif %}" href="{% url 'prompt' %}">AI Workflow</a>
            <a class="text-sm font-semibold {% if route == 'profile' or route == 'password_change' %}border-b-2 border-primary pb-1 text-primary{% else %}text-on-surface-variant hover:text-primary{% endif %}" href="{% url 'profile' %}">My Studio</a>
        </nav>
    </div>
    <div class="flex shrink-0 items-center gap-2 sm:gap-3">
        {% if user.is_authenticated %}
            <a class="hidden rounded-xl border border-outline-variant/15 px-4 py-2 text-sm font-semibold text-primary transition hover:bg-surface-container-low lg:inline-flex" href="{% url 'prompt' %}">새 프레젠테이션</a>
            <a class="inline-flex items-center gap-2 rounded-xl bg-surface-container-low px-2.5 py-2 transition hover:bg-surface-container sm:px-3" href="{% url 'profile' %}">
                <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-primary text-xs font-bold text-white">{{ user.username|first|upper }}</span>
                <span class="hidden text-sm font-semibold text-on-surface sm:inline">{{ user.username }}</span>
            </a>
            <a class="inline-flex items-center rounded-xl bg-gradient-to-br from-primary to-primary-container px-3 py-2 text-sm font-bold text-on-primary shadow-md transition hover:opacity-90 sm:px-4" href="{% url 'logout' %}">
                <span class="material-symbols-outlined text-base sm:hidden">logout</span>
                <span class="hidden sm:inline">로그아웃</span>
            </a>
        {% else %}
            <a class="rounded-xl border border-outline-variant/15 px-3 py-2 text-sm font-semibold text-primary transition hover:bg-surface-container-low sm:px-4" href="{% url 'login' %}">로그인</a>
            <a class="rounded-xl bg-gradient-to-br from-primary to-primary-container px-3 py-2 text-sm font-bold text-on-primary shadow-md transition hover:opacity-90 sm:px-4" href="{% url 'signup' %}">회원가입</a>
        {% endif %}
    </div>
</header>
{% endwith %}
