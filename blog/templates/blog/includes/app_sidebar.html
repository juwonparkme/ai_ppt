{% with route=request.resolver_match.url_name %}
<aside class="fixed left-0 top-16 hidden h-[calc(100vh-64px)] w-64 border-r border-white/60 bg-surface-container-low/90 p-4 backdrop-blur-xl md:flex md:flex-col">
    <div class="mb-6 rounded-2xl bg-surface-container-lowest p-4 shadow-soft">
        <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-primary/10 text-primary">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
            </div>
            <div>
                <p class="text-sm font-black text-primary">Presentation Mode</p>
                <p class="text-[10px] font-medium uppercase tracking-[0.22em] text-on-surface-variant">AI-Powered Editing</p>
            </div>
        </div>
        <a class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-br from-primary to-primary-container px-4 py-3 text-sm font-bold text-on-primary shadow-lg shadow-primary/20 transition hover:opacity-90" href="{% url 'prompt' %}">
            <span class="material-symbols-outlined text-base">add</span>
            New Presentation
        </a>
    </div>
    <nav class="flex-1 space-y-1">
        <a class="flex items-center gap-3 rounded-xl px-3 py-3 text-xs font-semibold tracking-[0.18em] {% if route == 'home' or route == 'sign_in' %}bg-surface-container-lowest text-primary shadow-sm{% else %}text-on-surface-variant hover:bg-surface-container-lowest/70 hover:text-primary{% endif %}" href="{% url 'home' %}">
            <span class="material-symbols-outlined text-base">dashboard</span>
            Dashboard
        </a>
        <a class="flex items-center gap-3 rounded-xl px-3 py-3 text-xs font-semibold tracking-[0.18em] {% if route == 'prompt' %}bg-surface-container-lowest text-primary shadow-sm{% else %}text-on-surface-variant hover:bg-surface-container-lowest/70 hover:text-primary{% endif %}" href="{% url 'prompt' %}">
            <span class="material-symbols-outlined text-base">auto_awesome</span>
            AI Workflow
        </a>
        <a class="flex items-center gap-3 rounded-xl px-3 py-3 text-xs font-semibold tracking-[0.18em] {% if route == 'template_library' %}bg-surface-container-lowest text-primary shadow-sm{% else %}text-on-surface-variant hover:bg-surface-container-lowest/70 hover:text-primary{% endif %}" href="{% url 'template_library' %}">
            <span class="material-symbols-outlined text-base">collections_bookmark</span>
            Templates
        </a>
        <a class="flex items-center gap-3 rounded-xl px-3 py-3 text-xs font-semibold tracking-[0.18em] {% if route == 'profile' %}bg-surface-container-lowest text-primary shadow-sm{% else %}text-on-surface-variant hover:bg-surface-container-lowest/70 hover:text-primary{% endif %}" href="{% url 'profile' %}">
            <span class="material-symbols-outlined text-base">folder_open</span>
            Projects
        </a>
        <a class="flex items-center gap-3 rounded-xl px-3 py-3 text-xs font-semibold tracking-[0.18em] {% if route == 'password_change' %}bg-surface-container-lowest text-primary shadow-sm{% else %}text-on-surface-variant hover:bg-surface-container-lowest/70 hover:text-primary{% endif %}" href="{% url 'password_change' %}">
            <span class="material-symbols-outlined text-base">settings</span>
            Account
        </a>
    </nav>
</aside>
{% endwith %}
