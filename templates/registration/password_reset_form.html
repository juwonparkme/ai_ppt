{% extends "site_auth_base.html" %}

{% block title %}비밀번호 재설정 | SlideArchitect{% endblock %}

{% block auth_intro %}
    <p class="mt-3 text-sm font-medium text-on-surface-variant">가입한 이메일로 재설정 링크를 보냅니다.</p>
{% endblock %}

{% block auth_content %}
    <form class="space-y-5" method="post">
        {% csrf_token %}
        <div class="space-y-2">
            <label class="ml-1 text-xs font-semibold text-on-surface-variant" for="id_email">이메일</label>
            <input class="w-full rounded-2xl border-none bg-surface-container-low px-4 py-3 text-sm font-medium text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/25" id="id_email" name="email" placeholder="name@company.com" required type="email" />
        </div>
        <div class="flex justify-end gap-3">
            <a class="rounded-2xl border border-outline-variant/15 px-4 py-3 text-sm font-semibold text-on-surface-variant transition hover:bg-surface-container-low" href="{% url 'login' %}">취소</a>
            <button class="rounded-2xl bg-gradient-to-r from-primary to-primary-container px-5 py-3 text-sm font-bold text-on-primary shadow-lg shadow-primary/20 transition hover:opacity-90" type="submit">재설정 메일 보내기</button>
        </div>
    </form>
{% endblock %}
