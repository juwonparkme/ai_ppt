{% extends "site_auth_base.html" %}

{% block title %}메일 전송 완료 | SlideArchitect{% endblock %}

{% block auth_intro %}
    <p class="mt-3 text-sm font-medium text-on-surface-variant">재설정 링크를 메일로 전송했습니다.</p>
{% endblock %}

{% block auth_content %}
    <div class="space-y-5 text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-secondary/15 text-secondary">
            <span class="material-symbols-outlined text-3xl">mark_email_read</span>
        </div>
        <p class="text-sm leading-7 text-on-surface-variant">
            받은편지함과 스팸함을 확인해 주세요. 메일 속 링크에서 새 비밀번호를 설정할 수 있습니다.
        </p>
        <a class="inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-primary to-primary-container px-5 py-3 text-sm font-bold text-on-primary shadow-lg shadow-primary/20 transition hover:opacity-90" href="{% url 'login' %}">로그인으로 돌아가기</a>
    </div>
{% endblock %}
