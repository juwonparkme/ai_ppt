{% extends "site_auth_base.html" %}

{% block title %}재설정 완료 | SlideArchitect{% endblock %}

{% block auth_intro %}
    <p class="mt-3 text-sm font-medium text-on-surface-variant">새 비밀번호가 저장되었습니다.</p>
{% endblock %}

{% block auth_content %}
    <div class="space-y-5 text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 text-primary">
            <span class="material-symbols-outlined text-3xl">verified</span>
        </div>
        <p class="text-sm leading-7 text-on-surface-variant">
            이제 새 비밀번호로 로그인할 수 있습니다.
        </p>
        <a class="inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-primary to-primary-container px-5 py-3 text-sm font-bold text-on-primary shadow-lg shadow-primary/20 transition hover:opacity-90" href="{% url 'login' %}">로그인하기</a>
    </div>
{% endblock %}
