services:
  app:
    build:
      context: .
    env_file:
      - ${LIGHTSAIL_APP_ENV_FILE:-./deploy/lightsail/app.env}
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - app_data:/data
      - ./deploy/lightsail/secrets:/secrets:ro
    environment:
      DJANGO_STATIC_ROOT: /data/staticfiles
      DJANGO_MEDIA_ROOT: /data/media
      DJANGO_DB_NAME: /data/db.sqlite3
      PPT_RENDER_OUTPUT_DIR: /data/rendered-presentations
      USER_TEMPLATE_STORAGE_DIR: /data/user-templates
      GOOGLE_CLIENT_SECRET_FILE: /secrets/client_secret.json
      GOOGLE_SERVICE_ACCOUNT_FILE: /secrets/credentials.json
      GOOGLE_TOKEN_FILE: /secrets/token.json

  web:
    image: nginx:1.27-alpine
    env_file:
      - ${LIGHTSAIL_APP_ENV_FILE:-./deploy/lightsail/app.env}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/lightsail/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_data:/data
      - ./deploy/lightsail/state/letsencrypt:/etc/letsencrypt
      - ./deploy/lightsail/state/certbot-www:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    env_file:
      - ${LIGHTSAIL_APP_ENV_FILE:-./deploy/lightsail/app.env}
    volumes:
      - ./deploy/lightsail/state/letsencrypt:/etc/letsencrypt
      - ./deploy/lightsail/state/certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait $$!
        done

volumes:
  app_data:
