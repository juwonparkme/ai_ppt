name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ai-ppt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check / Test / Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ppt-renderer/package-lock.json"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install renderer dependencies
        run: npm --prefix ppt-renderer ci

      - name: Django check
        run: python manage.py check

      - name: Django tests
        run: python manage.py test

      - name: Renderer typecheck
        run: npm --prefix ppt-renderer run typecheck

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Prepare SSH key
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add Lightsail host key
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_PORT: ${{ vars.LIGHTSAIL_PORT }}
        run: |
          set -eu
          PORT="${LIGHTSAIL_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_PORT: ${{ vars.LIGHTSAIL_PORT }}
          LIGHTSAIL_APP_DIR: ${{ vars.LIGHTSAIL_APP_DIR }}
        run: |
          set -eu
          PORT="${LIGHTSAIL_PORT:-22}"
          APP_DIR="${LIGHTSAIL_APP_DIR:-/opt/ai-ppt}"
          ssh -p "$PORT" "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" "cd '$APP_DIR' && sh ./deploy/lightsail/remote-deploy.sh"
