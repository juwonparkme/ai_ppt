name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ai-ppt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check / Test / Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ppt-renderer/package-lock.json"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install renderer dependencies
        run: npm --prefix ppt-renderer ci

      - name: Django check
        run: python manage.py check

      - name: Django tests
        run: python manage.py test

      - name: Renderer typecheck
        run: npm --prefix ppt-renderer run typecheck

  deploy:
    name: Deploy to production
    runs-on: [self-hosted, ai-ppt, production]
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AIPPT_DEPLOY_ENABLED == 'true'

    permissions:
      contents: read

    steps:
      - name: Run production deploy
        env:
          AIPPT_APP_DIR: ${{ vars.AIPPT_APP_DIR }}
        run: |
          set -eu
          APP_DIR="${AIPPT_APP_DIR:-/home/ubuntu/apps/ai-ppt}"
          cd "$APP_DIR"
          sh ./deploy/systemd/remote-deploy.sh
