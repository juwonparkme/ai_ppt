name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ai-ppt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check / Test / Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ppt-renderer/package-lock.json"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install renderer dependencies
        run: npm --prefix ppt-renderer ci

      - name: Django check
        run: python manage.py check

      - name: Django tests
        run: python manage.py test

      - name: Renderer typecheck
        run: npm --prefix ppt-renderer run typecheck

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AIPPT_DEPLOY_ENABLED == 'true'

    permissions:
      contents: read

    steps:
      - name: Prepare SSH key
        env:
          AIPPT_DEPLOY_SSH_KEY: ${{ secrets.AIPPT_DEPLOY_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$AIPPT_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add production host key
        env:
          AIPPT_DEPLOY_HOST: ${{ secrets.AIPPT_DEPLOY_HOST }}
          AIPPT_DEPLOY_PORT: ${{ vars.AIPPT_DEPLOY_PORT }}
        run: |
          set -eu
          PORT="${AIPPT_DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$AIPPT_DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy
        env:
          AIPPT_DEPLOY_HOST: ${{ secrets.AIPPT_DEPLOY_HOST }}
          AIPPT_DEPLOY_USER: ${{ secrets.AIPPT_DEPLOY_USER }}
          AIPPT_DEPLOY_PORT: ${{ vars.AIPPT_DEPLOY_PORT }}
          AIPPT_APP_DIR: ${{ vars.AIPPT_APP_DIR }}
        run: |
          set -eu
          PORT="${AIPPT_DEPLOY_PORT:-22}"
          APP_DIR="${AIPPT_APP_DIR:-/home/ubuntu/apps/ai-ppt}"
          ssh -p "$PORT" "$AIPPT_DEPLOY_USER@$AIPPT_DEPLOY_HOST" "cd '$APP_DIR' && sh ./deploy/systemd/remote-deploy.sh"
